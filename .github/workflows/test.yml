name: Check content and tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the Excel content
        run: node scripts/build-content.mjs --check
      - name: Answer-checking tests
        run: npm test
      - name: Build the website
        run: npm run build
