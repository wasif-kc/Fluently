# The "Publish Fluently" button: GitHub → Actions → Publish Fluently → Run workflow.
# It only runs when someone presses the button. It needs the FIREBASE_SERVICE_ACCOUNT secret.
name: Publish Fluently

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check and update the content
        run: npm run content
      - name: Answer-checking tests
        run: npm test
      - name: Build the website
        run: npm run build
      - name: Publish to Firebase
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then echo "The FIREBASE_SERVICE_ACCOUNT secret is missing."; exit 1; fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          PROJECT=$(node -p "require('./fluently.config.json').firebase.projectId")
          npx firebase deploy --only hosting,firestore:rules --project "$PROJECT" --non-interactive
